name: ci

on:
  push:
  pull_request:

jobs:
  build-test-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            8.0.x

      - name: Restore solution
        run: dotnet restore dotnet-sdk.sln

      - name: Lint solution
        run: dotnet format dotnet-sdk.sln --verify-no-changes --severity warn --no-restore

      - name: Build solution
        run: dotnet build dotnet-sdk.sln --configuration Release --no-restore -warnaserror

      - name: Test solution on .NET 10 and .NET 8
        run: dotnet test dotnet-sdk.sln --configuration Release --no-build --logger "console;verbosity=minimal"
